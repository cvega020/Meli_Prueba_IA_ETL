[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meli-llm-data-pipeline"
version = "0.1.0"
description = "Production-grade data pipeline for LLM corpus normalization and QA dataset generation"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Camilo Vega" }
]
dependencies = [
  "pydantic>=2.8.0",
  "python-dotenv>=1.0.1",
  "orjson>=3.10.0",
  "transformers>=4.44.0",
  "sentencepiece>=0.2.0",
  "xxhash>=3.4.1",
  "typer>=0.12.0"
]

[project.optional-dependencies]
dev = []

[project.scripts]
mlops-pipeline = "src.cli:app"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
lint.select = ["E", "F", "I", "B", "UP", "N", "S", "C4", "SIM"]
lint.ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_optional = true
